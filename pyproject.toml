[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "active-canvit-gaze"
version = "0.1.0"
description = "Biologically motivated gaze-selection policies for CanViT active-vision foundation model"
requires-python = ">=3.10"
dependencies = [
    "canvit-pytorch @ git+https://github.com/m2b3/CanViT-PyTorch.git",
    "torch>=2.0",
    "torchvision>=0.15",
    "huggingface_hub>=0.20",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scipy>=1.10",
    "tqdm>=4.65",
    "Pillow>=9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ipykernel",
    "ipywidgets",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
